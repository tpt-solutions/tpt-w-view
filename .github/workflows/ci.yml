name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # dav1d-sys (AVIF decode via image/avif-native) needs pkg-config on Linux and
  # no pkg-config on Windows, so build dav1d from source there (meson + ninja + nasm).
  SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: ${{ runner.os == 'Windows' && 'always' || 'auto' }}

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev pkg-config libdav1d-dev libde265-dev libx265-dev

      - name: Install HEIC/AVIF native build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        run: |
          pip install meson ninja
          choco install nasm pkgconfiglite -y --no-progress
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libde265 x265 --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "PKG_CONFIG_PATH=$prefix\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
